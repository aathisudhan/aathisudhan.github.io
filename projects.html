<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background: linear-gradient(white, skyblue);
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .project-container {
            display: flex;
            align-items: flex-start;
            background: linear-gradient(135deg, white, lightgreen);
            border: 5px solid darkgreen;
            padding: 15px;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            color: black;
            width: 80%;
            max-width: 1000px;
            position: relative;
            gap: 10px;
        }

        .project-image {
            width: 350px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 15px;
            border: 5px solid darkgreen;
        }

        .project-title {
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 0;
            white-space: nowrap;
            flex: 1;
        }

        .project-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-description {
            font-size: 14px;
            text-align: left;
            flex: 1;
        }

        .project-date {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            color: black;
            position: absolute;
            bottom: 0;
            right: 0;
            margin: 10px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="projects">Loading projects...</div>

    <script src="script.js"></script>

</body>

</html>

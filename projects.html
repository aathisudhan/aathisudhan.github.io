<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>

    <style>
        /* Styling for the body */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background: linear-gradient(white, skyblue);
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Container for each project */
        .project-container {
            display: flex;
            align-items: flex-start;
            background: linear-gradient(135deg, white, lightgreen);
            border: 5px solid darkgreen;
            padding: 15px;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            color: black;
            width: 80%;
            max-width: 1000px;
            position: relative;
            gap: 10px;
        }

        /* Styling for the project image */
        .project-image {
            width: 350px; /* Fixed width */
            height: 300px; /* Fixed height */
            object-fit: cover; /* Ensures the image maintains aspect ratio */
            border-radius: 10px;
            margin-right: 15px;
            border: 5px solid darkgreen;
        }

        /* Project title styling */
        .project-title {
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 0;
            white-space: nowrap; /* Prevents text from wrapping */
            flex: 1;
        }

        /* Container for project content */
        .project-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Description styling */
        .project-description {
            font-size: 14px;
            text-align: left;
            line-height: 1.6;
            flex: 1;
        }

        /* Container for project details */
        .project-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
        }

        /* Styling for the project upload date */
        .project-date {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            color: black;
            position: absolute;
            bottom: 0;
            right: 0;
            margin: 10px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <!-- Container where projects will be dynamically loaded -->
    <div id="projects">Loading projects...</div>

    <!-- Linking external JavaScript file to fetch and display project details -->
    <script src="script.js"></script>

</body>

</html>

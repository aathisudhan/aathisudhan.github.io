<!DOCTYPE html>
<html lang="en">

<head style="font-family: Arial, sans-serif;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="AATHISUDHAN A">
    <meta name="description" content="Portfolio Website">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>AS Portfolio</title>

    <style>
        nav a:hover {
            background-color: skyblue;
            transform: scale(1.1);
            border-radius: 0px;
        }
    </style>

</head>

<body style="margin: 0; padding: 0; text-align: center; overflow-x: hidden; 
             background: linear-gradient(white, skyblue);
             background-attachment: fixed;
             background-size: cover;
             background-repeat: no-repeat;">

    <!-- Navigation Bar -->
    <nav style="background-color: black; color: white; padding: 20px; position: fixed; top: 0; width: 100%;
                display: flex; flex-direction: row; align-items: flex-start; flex-wrap: wrap; font-size: 16px;
                font-family: 'Arial', sans-serif; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
                gap: 50px;">

        <a href="about.html" target="contentFrame" 
           style="color: white; text-decoration: none; padding: 10px 50px; transition: all .3s ease-in-out; margin-left: 50px;">
            About
        </a>

        <a href="projects.html" target="contentFrame" 
           style="color: white; text-decoration: none; padding: 10px 50px; transition: all .3s ease-in-out;">
            Projects
        </a>

    </nav>

    <!-- Main Content -->
    <iframe name="contentFrame" src="about.html" 
            style="position: absolute; top: 77px; left: 0; width: 100%; height: calc(100vh - 133px);
                   border-top: 5px solid blue; border-bottom: 5px solid blue; border-left: none; border-right: none;">
    </iframe>

    <!-- Footer -->
    <footer style="background-color: black; color: white; padding: 15px; position: fixed; bottom: 0; width: 100%;
                   text-align: center; font-size: 14px; font-family: 'Arial', sans-serif; font-weight: bold;
                   text-transform: uppercase; letter-spacing: 1px;">

        <p style="margin: 0;">&copy; 2025 AATHISUDHAN A | All Rights Reserved</p>

    </footer>

</body>

</html>

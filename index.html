<!DOCTYPE html>
<html lang="en">

<head style="font-family: Arial, sans-serif;">
    <!-- Meta Information -->
    <meta charset="UTF-8"> <!-- Defines character encoding for the document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling -->
    <meta name="author" content="AATHISUDHAN A"> <!-- Specifies the author of the webpage -->
    <meta name="description" content="Portfolio Website"> <!-- Brief description of the website -->
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Favicon for the website -->
    <title>AS Portfolio</title> <!-- Title of the webpage -->
    <script>
        function isDesktopView() {
            return window.innerWidth >= 1024; // Check screen width (adjust as needed)
        }

        function isRealDesktop() {
            const userAgent = navigator.userAgent.toLowerCase();
            return !/mobile|android|iphone|ipad|ipod|blackberry|opera mini|iemobile|wpdesktop/.test(userAgent);
        }

        function checkAccess() {
            if (!isDesktopView() && !isRealDesktop()) {
                document.body.innerHTML = "<h2 style='font-family: 'Arial', sans-serif; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 1px; color: red;'>This Page is Best Viewed on a Desktop.</h2>"; // Redirect or show a message
            }
        }

        window.onload = checkAccess;
        window.onresize = checkAccess; // Recheck on resize
    </script>

    <style>
        /* Navigation link hover effect */
        nav a:hover {
            background-color: orange; /* Changes background color on hover */
            transform: scale(1.1); /* Slightly enlarges the link */
            border-radius: 0px; /* No border rounding */
        }
    </style>

</head>

<body style="margin: 0; padding: 0; text-align: center; overflow-x: hidden; 
             background: linear-gradient(white, skyblue);
             background-attachment: fixed;
             background-size: cover;
             background-repeat: no-repeat;">

    <!-- Navigation Bar -->
    <nav style="background-color: black; color: white; padding: 20px; position: fixed; top: 0; width: 100%;
                display: flex; flex-direction: row; align-items: flex-start; flex-wrap: wrap; font-size: 16px;
                font-family: 'Arial', sans-serif; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
                gap: 50px;">

        <!-- About Page Link -->
        <a href="about.html" target="contentFrame" 
           style="color: white; text-decoration: none; padding: 10px 50px; transition: all .3s ease-in-out; margin-left: 50px;">
            About
        </a>

        <!-- Projects Page Link -->
        <a href="projects.html" target="contentFrame" 
           style="color: white; text-decoration: none; padding: 10px 50px; transition: all .3s ease-in-out;">
            Projects
        </a>

    </nav>

    <!-- Main Content Frame -->
    <iframe name="contentFrame" src="about.html" 
            style="position: absolute; top: 77px; left: 0; width: 100%; height: calc(100vh - 133px);
                   border-top: 5px solid blue; border-bottom: 5px solid blue; border-left: none; border-right: none;">
    </iframe>

    <!-- Footer Section -->
    <footer style="background-color: black; color: white; padding: 15px; position: fixed; bottom: 0; width: 100%;
                   text-align: center; font-size: 14px; font-family: 'Arial', sans-serif; font-weight: bold;
                   text-transform: uppercase; letter-spacing: 1px;">

        <p style="margin: 0;">&copy; 2025 AATHISUDHAN A | All Rights Reserved</p>

    </footer>

</body>

</html>
